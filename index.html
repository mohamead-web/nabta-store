<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نبته | متجر النباتات</title>

    <!-- OG / Twitter -->
    <meta property="og:title" content="نبته | متجر النباتات" />
    <meta property="og:description" content="متجر نبته — نباتات وزهور مع الدفع عند الاستلام" />
    <meta property="og:type" content="website" />

    <!-- Tailwind CDN (لا نكسره) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- تحسينات الواجهة المقروءة والـGlass -->
    <style>
      :root {
        --brand: #0F5731;
        --brand-deep: #0B3C24;
      }
      body {
        background: linear-gradient(120deg, #e8f3ed, #f6fbf7);
        color: #0B3C24; /* نص مقروء */
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      }
      .glass-card {
        background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.35));
        border: 1px solid rgba(255,255,255,.6);
        border-radius: 18px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 14px 34px rgba(15,87,49,.14);
        animation: fadeIn .3s ease-out;
      }
      .page-title {
        color: var(--brand-deep);
        font-weight: 800;
        letter-spacing: .2px;
      }
      ::placeholder { color: rgba(11,60,36,.65); } /* Placeholder واضح */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      /* استجابة للجوال */
      @media (max-width: 768px) {
        .product-details-grid { grid-template-columns: 1fr !important; }
        .checkout-grid { grid-template-columns: 1fr !important; }
        .drawer {
          width: calc(100vw - 24px) !important;
          inset-inline: 12px !important;
          bottom: 12px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
