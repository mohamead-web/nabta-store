    <!-- Tailwind (كما هو) + ملف CSS الخاص بك -->
    <link rel="stylesheet" href="/index.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- تحسينات التصميم: Liquid Glass + وضوح النص -->
    <style>
      :root {
        --brand: #0F5731;
        --brand-deep: #0B3C24;
        --glass-border: rgba(255,255,255,.35);
        --glass-fill-1: rgba(255,255,255,.18);
        --glass-fill-2: rgba(255,255,255,.08);
      }

      /* الحاويات الزجاجية (بطاقات/أقسام) */
      .glass-card {
        background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.10));
        border: 1px solid rgba(255,255,255,.32);
        border-radius: 18px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 14px 34px rgba(15,87,49,.14);
        animation: fadeIn .28s ease-out;
      }

      /* أزرار زجاجية */
      .btn-glass {
        border: 1px solid var(--glass-border);
        background: linear-gradient(180deg, var(--glass-fill-1), var(--glass-fill-2));
        color: #fff;
        font-weight: 700;
        border-radius: 14px;
        padding: 12px 20px;
        transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
        box-shadow: 0 10px 28px rgba(15,87,49,.25);
      }
      .btn-glass:hover { transform: translateY(-1px); box-shadow: 0 14px 36px rgba(15,87,49,.32); }
      .btn-glass:active { transform: scale(.98); }

      /* حقول إدخال بنص داكن ومقروء (لا يختفي) */
      .field-glass {
        width: 100%;
        border-radius: 14px;
        border: 1px solid var(--glass-border);
        background: linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,255,255,.70));
        color: var(--brand-deep);         /* نص داكن واضح */
        padding: 12px 14px;
        outline: none;
        box-shadow: 0 6px 20px rgba(15,87,49,.10);
      }
      .field-glass::placeholder { color: rgba(11,60,36,.55); } /* Placeholder واضح */
      label.glass-label { font-size: 13px; opacity: .9; color: var(--brand); font-weight: 600; }

      /* عناوين */
      .page-title { color: #fff; font-weight: 800; letter-spacing: .2px; }

      /* حركة خفيفة */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* استجابة للجوال (تبقى نفس متطلباتك) */
      @media (max-width: 768px) {
        .product-details-grid { grid-template-columns: 1fr !important; }
        .checkout-grid { grid-template-columns: 1fr !important; }
        .drawer {
          width: calc(100vw - 24px) !important;
          inset-inline-start: 12px !important;
          inset-inline-end: 12px !important;
          bottom: 12px !important;
          top: auto !important;
          height: 90vh;
        }
      }
    </style>
  </head>

  <!-- نحافظ على خلفية الهيرو الأصلية (داكنة) لكن الحقول نصها داكن داخل كروت فاتحة -->
  <body class="bg-[#0B3C24] bg-gradient-to-br from-[#0B3C24] to-[#0F5731] text-gray-200">

    <!-- ملاحظة: أبقيت الدخول من /index.tsx زي مشروعك الحالي -->
